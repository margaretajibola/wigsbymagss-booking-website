# .github/workflows/playwright.yml
name: Playwright Tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: magss
          POSTGRES_PASSWORD: 5TvCTH4jgtbwFC8jxyAv
          POSTGRES_DB: wbm_booking_app_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Setup test database
      run: |
        cp .env .env.test
        echo "DATABASE_URL=postgresql://magss:5TvCTH4jgtbwFC8jxyAv@localhost:5432/wbm_booking_app_test" >> .env.test
      
    - name: Run database migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: postgresql://magss:5TvCTH4jgtbwFC8jxyAv@localhost:5432/wbm_booking_app_test
        
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Start application
      run: |
        npm run build
        npm start &
        sleep 10
      env:
        DATABASE_URL: postgresql://magss:5TvCTH4jgtbwFC8jxyAv@localhost:5432/wbm_booking_app_test
        
    - name: Run Playwright tests
      run: npx playwright test
      env:
        DATABASE_URL: postgresql://magss:5TvCTH4jgtbwFC8jxyAv@localhost:5432/wbm_booking_app_test
        
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
        retention-days: 30